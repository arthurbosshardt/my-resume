<div class="header">
  <div class="header-content">
    <div class="header-right">
      <div class="header-image">
        @if (!imageError()) {
          <img
            [src]="imagePath"
            [alt]="personal().name"
            class="profile-photo"
            (error)="onImageError()"
          />
        } @else {
          <div class="profile-placeholder">
            <span>Photo</span>
          </div>
        }
      </div>
    </div>
    <div class="header-grid">
      <div class="header-left">
        <h1 class="name"><span class="name-first">{{ getFirstName() }}</span> <span class="name-last">{{ getLastName() }}</span></h1>
        <p class="role">{{ i18n.t('header.role') }} <span class="role-location" [innerHTML]="i18n.t('header.roleLocation')"></span></p>
        <p class="age-location">
          <i class="fa-solid fa-cake-candles age-icon"></i>
          {{ getAge() }} {{ i18n.t('header.yearsOld') }}
          <span class="separator"> • </span>
          <i class="fa-solid fa-location-dot location-icon"></i>
          {{ getLocation() }}
        </p>
      </div>
      <div class="header-right-links">
        <a
          href="https://github.com/arthurbosshardt"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="GitHub: @arthurbosshardt"
        >
          <i class="fa-brands fa-github social-icon"></i>
          <span class="link-label">@arthurbosshardt</span>
        </a>
        <a
          href="https://www.linkedin.com/in/arthur-bosshardt/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="LinkedIn: @arthur_bosshardt"
        >
          <i class="fa-brands fa-linkedin social-icon"></i>
          <span class="link-label">@arthur_bosshardt</span>
        </a>
        <a
          [href]="'tel:' + personal().contact.phone"
          class="contact-link"
          [attr.aria-label]="'Téléphone : ' + formatPhone(personal().contact.phone)"
        >
          <i class="fa-solid fa-phone phone-icon"></i>
          <span class="link-label">{{ formatPhone(personal().contact.phone) }}</span>
        </a>
        <a
          [href]="'mailto:' + personal().contact.email"
          class="contact-link"
          [attr.aria-label]="'Email : ' + personal().contact.email"
        >
          <i class="fa-solid fa-envelope contact-icon"></i>
          <span class="link-label">{{ personal().contact.email }}</span>
        </a>
      </div>
      <div class="header-language-toggle">
        <button
          class="header-language-toggle-btn"
          [class.active]="currentLanguage() === 'en'"
          (click)="languageChange.emit('en')"
          title="English"
          aria-label="English"
        >
          <svg class="flag-icon" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="60" height="40" fill="#00247d"/>
            <path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/>
            <path d="M0,0 L60,40 M60,0 L0,40" stroke="#cf142b" stroke-width="4"/>
            <path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="14"/>
            <path d="M30,0 V40 M0,20 H60" stroke="#cf142b" stroke-width="6"/>
          </svg>
        </button>
        <button
          class="header-language-toggle-btn"
          [class.active]="currentLanguage() === 'fr'"
          (click)="languageChange.emit('fr')"
          title="Français"
          aria-label="Français"
        >
          <svg class="flag-icon" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="20" height="40" fill="#0055A4"/>
            <rect x="20" width="20" height="40" fill="#FFFFFF"/>
            <rect x="40" width="20" height="40" fill="#EF4135"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
